services:
  league-service:
    build: ./league-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - basketball-net
  
  team-service:
    build: ./team-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    networks:
      - basketball-net

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - league-service
      - team-service
    environment:
      - LEAGUE_SERVICE_URL=http://league-service:8081
      - TEAM_SERVICE_URL=http://team-service:8082
    networks:
      - basketball-net

  frontend-service:
    build: ./frontend-service
    ports:
      - 4200:80
    depends_on:
      - gateway-service
    networks:
      - basketball-net

networks:
  basketball-net:
    driver: bridge