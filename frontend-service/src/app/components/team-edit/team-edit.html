<div class="container" *ngIf="team; else loading">
  <h2>Edycja drużyny: {{ team.name }}</h2>

  <div class="form-group">
    <label>Nazwa drużyny:</label>
    <input [(ngModel)]="team.name" class="form-control">
  </div>

  <div class="form-group">
    <label>Miasto:</label>
    <input [(ngModel)]="team.city" class="form-control">
  </div>

  <div style="margin-top: 20px;">
    <button (click)="updateTeam()" style="background-color: #4CAF50; color: white;">Zapisz zmiany</button>
    <button [routerLink]="['/edit', team.leagueId]" style="margin-left: 10px;">Anuluj</button>
  </div>
</div>

<ng-template #loading>
  <p>Czekaj, pobieram dane drużyny...</p>
</ng-template>
