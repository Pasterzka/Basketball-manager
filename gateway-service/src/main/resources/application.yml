server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:4200"
                allowed-methods: "*"
                allowed-headers: "*"
          routes:
            - id: team-service
              uri: http://localhost:8082
              predicates:
                - Path=/leagues/*/teams/**, /leagues/*/teams, /teams/**

            - id: league-service
              uri: http://localhost:8081
              predicates:
                - Path=/leagues/**